<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกนบาร์โค้ดสินค้า</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #reader { width: 100%; margin-bottom: 20px; position: relative; }
        .modal-backdrop {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.55);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-backdrop.show { display: flex; }
        .modal-box {
            background: white;
            border-radius: 14px;
            padding: 24px 20px;
            width: 85%;
            max-width: 380px;
            text-align: left;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            position: relative;
            animation: popIn 0.18s ease-out;
        }
        @keyframes popIn {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .modal-box.modal-error { text-align: center; }
        .modal-box h3 { margin: 0 0 14px 0; font-size: 19px; color: #2c3e50; display: flex; align-items: center; gap: 8px; }
        .modal-box h3.ok::before { content: "✅"; }
        .modal-box .data-row { font-size: 17px; margin-bottom: 10px; line-height: 1.4; }
        .modal-box .data-row strong { color: #555; display: block; font-size: 13px; margin-bottom: 2px; }
        .modal-close-btn {
            display: block;
            width: 100%;
            margin-top: 16px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        .modal-error .modal-close-btn { background: #e74c3c; }
        .modal-error-icon { font-size: 40px; margin-bottom: 10px; }
        #status { margin-bottom: 10px; color: #555; }
        button#reloadBtn { margin-top: 10px; padding: 8px 16px; border: none; border-radius: 6px; background: #3498db; color: white; cursor: pointer; }
        .manual-entry { margin-top: 20px; padding-top: 15px; border-top: 1px dashed #ccc; text-align: left; }
        .manual-entry label { display: block; margin-bottom: 8px; font-size: 14px; color: #555; }
        .manual-row { display: flex; gap: 8px; }
        .manual-row input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; }
        .manual-row button { padding: 10px 16px; border: none; border-radius: 6px; background: #2c3e50; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>สแกนบาร์โค้ดสินค้า</h2>
    <div id="readerWrap" style="position: relative;">
        <div id="reader"></div>
    </div>
    <div id="status">กำลังโหลดข้อมูลจาก Google Sheets...</div>
    <button id="reloadBtn" onclick="loadData()">โหลดข้อมูลใหม่</button>

    <div class="manual-entry">
        <label for="manualBarcode">สแกนไม่ติด? พิมพ์รหัสสินค้าเอง:</label>
        <div class="manual-row">
            <input type="text" id="manualBarcode" placeholder="กรอกรหัสบาร์โค้ด" inputmode="numeric">
            <button onclick="lookupManual()">ค้นหา</button>
        </div>
    </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) hideOverlay()">
    <div class="modal-box" id="modalBox">
        <h3 class="ok">รายละเอียดสินค้า</h3>
        <div class="data-row"><strong>Barcode</strong><span id="resBarcode">-</span></div>
        <div class="data-row"><strong>ชื่อสินค้า</strong><span id="resName">-</span></div>
        <div class="data-row"><strong>Mer. Feedback</strong><span id="resFeedback">-</span></div>
        <button class="modal-close-btn" onclick="hideOverlay()">ปิด / สแกนต่อ</button>
    </div>
</div>
</div>

<script>
    // ลิงก์ CSV จาก Google Sheets (Publish to web -> CSV)
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7gT3uKflnmDli00gcHzD8UfT4rtHZkOto51PpFiIa5dDZ9qZwekjvMy-Xe2UDrzQ1UB0viphhMraT/pub?output=csv";

    let productDatabase = {};
    let scannerStarted = false;

    function loadData() {
        document.getElementById('status').innerText = "กำลังโหลดข้อมูลจาก Google Sheets...";
        document.getElementById('errorMsg').innerText = "";

        // เติม timestamp กัน cache ของ Google Sheets/เบราว์เซอร์
        const urlWithCacheBust = GOOGLE_SHEET_CSV_URL + (GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now();

        Papa.parse(urlWithCacheBust, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;

                // Debug: ดูหัวคอลัมน์จริงที่โหลดมา (เปิด console กด F12 เพื่อดู)
                if (results.meta && results.meta.fields) {
                    console.log('หัวคอลัมน์ที่พบในชีต:', results.meta.fields);
                }
                console.log('ตัวอย่างแถวแรก:', data[0]);

                productDatabase = {};
                data.forEach(row => {
                    // หา key คอลัมน์แบบไม่สนตัวพิมพ์เล็ก-ใหญ่/ช่องว่างส่วนเกิน
                    const keys = Object.keys(row);
                    const findKey = (target) => keys.find(k => k.trim().toLowerCase() === target.toLowerCase());

                    const barcodeKey = findKey('รหัสสินค้า');
                    const nameKey = findKey('ชื่อสินค้า');
                    const feedbackKey = findKey('Mer. Feedback');

                    let rawBarcode = barcodeKey ? String(row[barcodeKey]).trim() : null;
                    if (rawBarcode) {
                        const entry = {
                            name: nameKey ? row[nameKey] : '-',
                            feedback: feedbackKey ? row[feedbackKey] : '-'
                        };
                        // เก็บทั้งแบบตรงตัว และแบบเติม/ตัดเลข 0 นำหน้า เผื่อรูปแบบบาร์โค้ดไม่ตรงกัน
                        productDatabase[rawBarcode] = entry;
                        productDatabase[rawBarcode.replace(/^0+/, '')] = entry;
                        productDatabase['0' + rawBarcode] = entry;
                    }
                });
                console.log('จำนวนบาร์โค้ดในฐานข้อมูล:', Object.keys(productDatabase).length, productDatabase);
                document.getElementById('status').innerText = "พร้อมสแกนแล้ว! (สินค้าทั้งหมด " + data.length + " รายการ)";
                if (!scannerStarted) {
                    startScanner();
                    scannerStarted = true;
                }
            },
            error: function(error) {
                document.getElementById('status').innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
                console.error(error);
            }
        });
    }

    function startScanner() {
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            {
                fps: 15,
                // กล่องสแกนแบบกว้าง เหมาะกับบาร์โค้ดเส้นแนวนอนมากกว่ากล่องสี่เหลี่ยมจัตุรัส
                qrbox: function (viewfinderWidth, viewfinderHeight) {
                    const w = Math.floor(viewfinderWidth * 0.85);
                    const h = Math.floor(Math.min(viewfinderHeight * 0.5, w * 0.5));
                    return { width: w, height: h };
                },
                aspectRatio: 1.5,
                // ระบุชนิดบาร์โค้ดที่ใช้จริงชัดเจน ลด false negative และช่วยให้สแกนไวขึ้น
                formatsToSupport: [
                    Html5QrcodeSupportedFormats.QR_CODE,
                    Html5QrcodeSupportedFormats.CODE_128,
                    Html5QrcodeSupportedFormats.CODE_39,
                    Html5QrcodeSupportedFormats.EAN_13,
                    Html5QrcodeSupportedFormats.EAN_8,
                    Html5QrcodeSupportedFormats.UPC_A,
                    Html5QrcodeSupportedFormats.UPC_E,
                    Html5QrcodeSupportedFormats.ITF
                ],
                // ใช้ BarcodeDetector ของเบราว์เซอร์เอง (เร็ว/แม่นกว่า) ถ้ารองรับ
                experimentalFeatures: {
                    useBarCodeDetectorIfSupported: true
                },
                rememberLastUsedCamera: true,
                showTorchButtonIfSupported: true,
                showZoomSliderIfSupported: true,
                defaultZoomValueIfSupported: 2
            },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function hideOverlay() {
        document.getElementById('modalBackdrop').classList.remove('show');
        scanLocked = false;
    }

    function showSuccessModal(code, product) {
        const box = document.getElementById('modalBox');
        box.classList.remove('modal-error');
        box.innerHTML = `
            <h3 class="ok">รายละเอียดสินค้า</h3>
            <div class="data-row"><strong>Barcode</strong><span>${code}</span></div>
            <div class="data-row"><strong>ชื่อสินค้า</strong><span>${product.name}</span></div>
            <div class="data-row"><strong>Mer. Feedback</strong><span>${product.feedback}</span></div>
            <button class="modal-close-btn" onclick="hideOverlay()">ปิด / สแกนต่อ</button>
        `;
        document.getElementById('modalBackdrop').classList.add('show');
    }

    function showErrorModal(code) {
        const box = document.getElementById('modalBox');
        box.classList.add('modal-error');
        box.innerHTML = `
            <div class="modal-error-icon">❌</div>
            <h3 style="justify-content:center;">ไม่พบข้อมูลสินค้า</h3>
            <div class="data-row" style="text-align:center;">รหัส: ${code}</div>
            <button class="modal-close-btn" onclick="hideOverlay()">ปิด / สแกนต่อ</button>
        `;
        document.getElementById('modalBackdrop').classList.add('show');
    }

    function lookupBarcode(rawCode) {
        const code = String(rawCode).trim();
        const product = productDatabase[code]
            || productDatabase[code.replace(/^0+/, '')]
            || productDatabase['0' + code];

        if (product) {
            showSuccessModal(code, product);
        } else {
            showErrorModal(code);
        }
    }

    let scanLocked = false;

    function onScanSuccess(decodedText, decodedResult) {
        if (scanLocked) return;
        scanLocked = true;
        console.log('สแกนได้:', decodedText);
        lookupBarcode(decodedText);
    }

    function onScanFailure(error) {
        // ไม่ต้องแสดงผลตอนที่กล้องยังหาสัญญาณไม่เจอ
    }

    function lookupManual() {
        const input = document.getElementById('manualBarcode');
        if (input.value.trim()) {
            lookupBarcode(input.value);
        }
    }
    document.addEventListener('DOMContentLoaded', function () {
        const input = document.getElementById('manualBarcode');
        if (input) {
            input.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') lookupManual();
            });
        }
    });

    loadData();
</script>

</body>
</html>
