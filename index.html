<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบสแกนบาร์โค้ดสินค้า</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <style>
        body { font-family: 'Sarabun', sans-serif; text-align: center; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        #reader { width: 100%; margin-bottom: 20px; }
        .result-card { display: none; margin-top: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px; text-align: left; background: #fafafa; }
        .result-card h3 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .data-row { margin-bottom: 10px; font-size: 16px; }
        .data-row strong { color: #555; }
        .error { color: red; font-weight: bold; margin-top: 10px; }
        #status { margin-bottom: 10px; color: #555; }
        button#reloadBtn { margin-top: 10px; padding: 8px 16px; border: none; border-radius: 6px; background: #3498db; color: white; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h2>สแกนบาร์โค้ดสินค้า</h2>
    <div id="reader"></div>
    <div id="status">กำลังโหลดข้อมูลจาก Google Sheets...</div>

    <div class="result-card" id="resultCard">
        <h3>รายละเอียดสินค้า</h3>
        <div class="data-row"><strong>Barcode:</strong> <span id="resBarcode">-</span></div>
        <div class="data-row"><strong>ชื่อสินค้า:</strong> <span id="resName">-</span></div>
        <div class="data-row"><strong>Mer. Feedback:</strong> <span id="resFeedback">-</span></div>
    </div>
    <div class="error" id="errorMsg"></div>
    <button id="reloadBtn" onclick="loadData()">โหลดข้อมูลใหม่</button>
</div>

<script>
    // ลิงก์ CSV จาก Google Sheets (Publish to web -> CSV)
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT7gT3uKflnmDli00gcHzD8UfT4rtHZkOto51PpFiIa5dDZ9qZwekjvMy-Xe2UDrzQ1UB0viphhMraT/pub?output=csv";

    let productDatabase = {};
    let scannerStarted = false;

    function loadData() {
        document.getElementById('status').innerText = "กำลังโหลดข้อมูลจาก Google Sheets...";
        document.getElementById('errorMsg').innerText = "";

        // เติม timestamp กัน cache ของ Google Sheets/เบราว์เซอร์
        const urlWithCacheBust = GOOGLE_SHEET_CSV_URL + (GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?') + '_=' + Date.now();

        Papa.parse(urlWithCacheBust, {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                const data = results.data;
                productDatabase = {};
                data.forEach(row => {
                    // ชื่อคอลัมน์ต้องตรงกับหัวตารางใน Google Sheet: Barcode, Name, Mer. Feedback
                    let barcode = row['Barcode'] ? String(row['Barcode']).trim() : null;
                    if (barcode) {
                        productDatabase[barcode] = {
                            name: row['Name'] || '-',
                            feedback: row['Mer. Feedback'] || '-'
                        };
                    }
                });
                document.getElementById('status').innerText = "พร้อมสแกนแล้ว! (สินค้าทั้งหมด " + Object.keys(productDatabase).length + " รายการ)";
                if (!scannerStarted) {
                    startScanner();
                    scannerStarted = true;
                }
            },
            error: function(error) {
                document.getElementById('status').innerText = "เกิดข้อผิดพลาดในการโหลดข้อมูล";
                console.error(error);
            }
        });
    }

    function startScanner() {
        const html5QrcodeScanner = new Html5QrcodeScanner(
            "reader",
            { fps: 10, qrbox: { width: 250, height: 150 } },
            /* verbose= */ false
        );
        html5QrcodeScanner.render(onScanSuccess, onScanFailure);
    }

    function onScanSuccess(decodedText, decodedResult) {
        document.getElementById('errorMsg').innerText = "";

        if (productDatabase[decodedText]) {
            let product = productDatabase[decodedText];
            document.getElementById('resBarcode').innerText = decodedText;
            document.getElementById('resName').innerText = product.name;
            document.getElementById('resFeedback').innerText = product.feedback;
            document.getElementById('resultCard').style.display = 'block';
        } else {
            document.getElementById('resultCard').style.display = 'none';
            document.getElementById('errorMsg').innerText = `ไม่พบข้อมูลสำหรับบาร์โค้ด: ${decodedText}`;
        }
    }

    function onScanFailure(error) {
        // ไม่ต้องแสดงผลตอนที่กล้องยังหาสัญญาณไม่เจอ
    }

    loadData();
</script>

</body>
</html>
